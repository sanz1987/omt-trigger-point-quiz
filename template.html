<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b"><title>OMT II – Trigger Point Muscle Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f6f9;color:#1b2733;font-size:18px;line-height:1.4}
header{background:#1f5f8b;color:#fff;padding:14px 16px;font-weight:700;font-size:19px}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px #0002;margin-bottom:14px}
button,select{font:inherit}.btn{display:block;width:100%;min-height:56px;margin:10px 0;padding:14px 16px;border:2px solid #c9d6e2;border-radius:12px;background:#fff;text-align:left;font-size:17px;cursor:pointer;color:inherit}
.btn:active{background:#eef4fa}.primary{background:#1f5f8b;color:#fff;border-color:#1f5f8b;text-align:center;font-weight:600}
.secondary{text-align:center;font-weight:600}.ok{background:#e3f6e8;border-color:#2e9d4f}.bad{background:#fde7e7;border-color:#d33}
.muted{color:#5b6b7a;font-size:15px}.q{font-size:19px;font-weight:600;margin:6px 0 4px}.exp{margin-top:12px;padding:12px;border-radius:10px;background:#f0f5fa;font-size:16px}
select{width:100%;min-height:52px;padding:10px;border-radius:12px;border:2px solid #c9d6e2;background:#fff;font-size:17px}
.bar{height:6px;background:#dde6ee;border-radius:3px;overflow:hidden}.bar>div{height:100%;background:#1f5f8b}
.big{font-size:44px;font-weight:800;text-align:center;margin:10px 0}
</style></head><body>
<header>OMT II · Trigger Point Muscles Quiz</header>
<main id="app"></main>
<script type="application/json" id="bank">/*__BANK__*/</script>
<script>
const BANK=JSON.parse(document.getElementById('bank').textContent);
const N=20, KEY='omtQuizMistakes', app=document.getElementById('app');
const regions=[...new Set(BANK.muscles.map(m=>m.region))];
let st={};
const mistakes=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const saveM=a=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function home(){
  const m=mistakes().length, reg=localStorage.getItem('omtRegion')||'';
  app.innerHTML=`<div class="card"><p class="muted">${BANK.muscles.length} muscles · ${BANK.questions.length} questions (origins, insertions, actions). Each quiz: ${N} random questions.</p>
  <label class="muted" for="reg">Region</label><select id="reg"><option value="">All regions</option>${regions.map(r=>`<option ${r===reg?'selected':''}>${esc(r)}</option>`).join('')}</select>
  <button class="btn primary" id="go">Start quiz</button>
  <button class="btn secondary" id="rev" ${m?'':'disabled style="opacity:.5"'}>Review mistakes (${m})</button>
  ${m?'<button class="btn secondary muted" id="clr">Clear mistake list</button>':''}</div>`;
  document.getElementById('go').onclick=()=>{const r=document.getElementById('reg').value;localStorage.setItem('omtRegion',r);start(BANK.questions.filter(q=>!r||q.region===r),false)};
  if(m)document.getElementById('rev').onclick=()=>{const ids=new Set(mistakes());start(BANK.questions.filter(q=>ids.has(q.id)),true)};
  const c=document.getElementById('clr');if(c)c.onclick=()=>{if(confirm('Clear all saved mistakes?')){saveM([]);home()}};
}
function start(pool,review){
  const qs=shuffle(pool).slice(0,N).map(q=>{const o=shuffle(q.options.map((t,i)=>({t,c:i===q.answer})));return{...q,o}});
  st={qs,i:0,score:0,review,wrong:[]};show();
}
function show(){
  const q=st.qs[st.i],n=st.qs.length;
  app.innerHTML=`<div class="card"><div class="muted">${st.review?'Review · ':''}Question ${st.i+1} / ${n} · Score ${st.score}</div>
  <div class="bar"><div style="width:${100*st.i/n}%"></div></div><p class="q">${esc(q.q)}</p>
  ${q.o.map((o,k)=>`<button class="btn opt" data-k="${k}">${esc(o.t)}</button>`).join('')}<div id="fb"></div></div>
  <button class="btn secondary" id="quit">Quit to menu</button>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  document.getElementById('quit').onclick=home;window.scrollTo(0,0);
}
function answer(k){
  const q=st.qs[st.i],btns=document.querySelectorAll('.opt');btns.forEach(b=>b.onclick=null);
  const right=q.o[k].c;let ms=mistakes();
  if(right){st.score++;if(st.review)ms=ms.filter(id=>id!==q.id)}else{st.wrong.push(q.id);if(!ms.includes(q.id))ms.push(q.id)}
  saveM(ms);
  q.o.forEach((o,j)=>{if(o.c)btns[j].classList.add('ok');else if(j===k)btns[j].classList.add('bad')});
  const last=st.i===st.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="exp"><b>${right?'✅ Correct':'❌ Incorrect'}</b><br>${esc(q.explanation)}</div>
  <button class="btn primary" id="nx">${last?'See score':'Next →'}</button>`;
  document.getElementById('nx').onclick=()=>{if(last)end();else{st.i++;show()}};
  document.getElementById('nx').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function end(){
  const n=st.qs.length,p=Math.round(100*st.score/n);
  app.innerHTML=`<div class="card"><div class="muted">${st.review?'Review finished':'Quiz finished'}</div><div class="big">${st.score} / ${n}</div><p style="text-align:center">${p}%${st.wrong.length?` · ${st.wrong.length} added to Review mistakes`:''}</p>
  <button class="btn primary" id="nq">New quiz</button><button class="btn secondary" id="hm">Menu</button></div>`;
  document.getElementById('nq').onclick=()=>{const r=localStorage.getItem('omtRegion')||'';start(BANK.questions.filter(q=>!r||q.region===r),false)};
  document.getElementById('hm').onclick=home;
}
home();
</script></body></html>
